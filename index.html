<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新能源汽车问答助手 · RAG 静态演示</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --ink: #1f2329; --sub: #8a9099;
    --line: #eceef1; --blue: #2563eb; --green: #16a34a; --orange: #ea580c; --gray: #6b7280;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--ink); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 120px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .meta { color: var(--sub); font-size: 13px; margin-bottom: 12px; }
  .notice { background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
            border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.6; margin-bottom: 20px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { padding: 6px 12px; border: 1px solid var(--line); border-radius: 14px;
          background: var(--card); font-size: 13px; color: var(--gray); cursor: pointer; }
  .chip:hover { border-color: var(--blue); color: var(--blue); }
  .chat { display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 10px; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 12px 14px; border-radius: 12px; line-height: 1.6; font-size: 15px; }
  .user .bubble { background: var(--blue); color: #fff; border-bottom-right-radius: 4px; }
  .bot .bubble { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--sub); }
  .tag { padding: 2px 8px; border-radius: 10px; background: var(--bg); }
  .tag.ok { color: var(--green); background: #f0fdf4; }
  .tag.block { color: var(--orange); background: #fff7ed; }
  .tag.muted { color: var(--gray); }
  .input-bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card);
               border-top: 1px solid var(--line); padding: 12px 16px; }
  .input-inner { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
  input { flex: 1; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; outline: none; }
  input:focus { border-color: var(--blue); }
  button { padding: 12px 20px; border: none; border-radius: 10px; background: var(--blue); color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <h1>新能源汽车问答助手</h1>
  <div class="meta">RAG 检索增强 · LoRA 微调 Qwen3-4B · 实体校验 + 意图识别 + 阈值兜底（静态演示）</div>
  <div class="notice">
    本页为<b>纯前端演示原型</b>：分流与检索逻辑在浏览器内运行，答案取自仓库归档评测结果，不调用在线大模型；
    完整 LoRA 微调 + vLLM 部署 + 神经向量 RAG 后端见<a href="https://gitee.com/beyond-invincibility/ev-car-rag-bot" target="_blank" rel="noopener">源码仓库</a>。车型与参数均为虚构演示语料，不对应真实品牌。
  </div>
  <div class="chips" id="chips">
    <button class="chip" data-q="星驰 A5 长续航版的电池和 CLTC 续航是多少？">A5 续航参数</button>
    <button class="chip" data-q="云澜 C3 的直流快充速度怎么样？">C3 快充速度</button>
    <button class="chip" data-q="星驰 B8 的续航是多少公里？">未知车型拦截</button>
    <button class="chip" data-q="能帮我拟一份购车合同吗？">越界意图拦截</button>
  </div>
  <div class="chat" id="chat">
    <div class="msg bot"><div class="bubble">你好，我是新能源汽车知识问答助手。可以问我车型参数、充电补能、续航习惯、保养质保等问题；超出资料范围的问题我会如实说明。</div></div>
  </div>
</div>
<div class="input-bar">
  <div class="input-inner">
    <input id="q" placeholder="例如：7kW 充电桩给 60kWh 电池充满要多久？" autocomplete="off">
    <button id="send">发送</button>
  </div>
</div>

<script src="qa_data.js"></script>
<script src="app.js"></script>
<script>
  document.querySelectorAll('.chip').forEach((c) => {
    c.addEventListener('click', () => {
      document.getElementById('q').value = c.dataset.q;
      document.getElementById('send').click();
    });
  });
</script>
</body>
</html>
